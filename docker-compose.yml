services:
  ml-service:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      # Admin auth (see .env)
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - JWT_SECRET=${JWT_SECRET:-dev-insecure-secret-change-me}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-12}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
    # Lets the proxy wait until the API is really answering. python-slim has no curl.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        # Vite bakes this at build time.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - ml-service

  # Forward proxy that blocks phishing URLs. Point your browser's HTTP *and* HTTPS
  # proxy at 127.0.0.1:8081.
  proxy:
    build: ./proxy
    ports:
      # Bound to loopback on purpose: "8081:8081" would expose an open forward
      # proxy to everyone on your network.
      - "127.0.0.1:8081:8081"
    environment:
      - API_URL=http://ml-service:8000/api/predict
      - LISTEN_HOST=0.0.0.0   # inside the container; the host-side port above stays loopback-only
      - LISTEN_PORT=8081
    depends_on:
      ml-service:
        condition: service_healthy
